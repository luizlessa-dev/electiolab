name: Ingest TSE Histórico Eleitoral (weekly)

# Histórico eleitoral dos candidatos (2018/2022/2024) por município/zona —
# scripts/ingest-tse-prior-results.ts, restaurado em 2026-09-23 (removido do
# git em 2026-05-07 por dependência dev não commitada, já resolvida:
# adm-zip/iconv-lite/csv-parse estão no package.json). Semanal porque é
# dado histórico estático — só precisa recapturar quando um candidato novo
# é adicionado à base 2026 pelo cron diário de candidaturas e ainda não tem
# histórico eleitoral capturado.

on:
  schedule:
    - cron: "0 14 * * 1" # semanal, segunda 14:00 UTC (11:00 BRT)
  workflow_dispatch:
    inputs:
      year:
        description: "Ano específico (default: roda 2024, 2022 e 2018)"
        required: false

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Ingest histórico eleitoral TSE
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          YEAR_ARG=""
          if [ -n "${{ inputs.year }}" ]; then YEAR_ARG="--year=${{ inputs.year }}"; fi
          npx tsx scripts/ingest-tse-prior-results.ts --apply $YEAR_ARG

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `🚨 Cron TSE Histórico Eleitoral falhou — ${today}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
              per_page: 50,
            });
            const existing = issues.find((i) => i.title.includes("Cron TSE Histórico Eleitoral falhou"));
            const body = [
              `Workflow **Ingest TSE Histórico Eleitoral (weekly)** falhou.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Quando:** ${new Date().toISOString()}`,
              `**Disparo:** ${context.eventName}`,
              ``,
              `Rodar manual:`,
              `\`\`\`bash`,
              `gh workflow run ingest-tse-prior-results.yml`,
              `\`\`\``,
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nova falha — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["cron-failure", "automated"],
              });
            }
