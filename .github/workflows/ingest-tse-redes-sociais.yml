name: Ingest TSE Redes Sociais 2026 (daily)

# Redes sociais declaradas ao TSE por candidato — dataset já publicado desde
# ago/2026 (achado em 2026-08-19: não estava sendo ingerido por falta de
# script, não por bloqueio do TSE). Diário porque candidatos ainda
# atualizam/corrigem links declarados perto do fechamento de campanha.

on:
  schedule:
    - cron: "0 13 * * *" # diário 13:00 UTC (10:00 BRT) — depois do ingest-tse-prestacao-contas (09:00 BRT)
  workflow_dispatch:
    inputs:
      year:
        description: "Ano da eleição (default 2026)"
        required: false
        default: "2026"

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Ingest redes sociais de candidatos TSE
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          YEAR_ARG="--year=${{ inputs.year || '2026' }}"
          npx tsx scripts/ingest-tse-redes-sociais.ts --apply $YEAR_ARG

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);
            const title = `🚨 Cron TSE Redes Sociais falhou — ${today}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "cron-failure",
              per_page: 50,
            });
            const existing = issues.find((i) => i.title.includes("Cron TSE Redes Sociais falhou"));
            const body = [
              `Workflow **Ingest TSE Redes Sociais 2026 (daily)** falhou.`,
              ``,
              `**Run:** ${runUrl}`,
              `**Quando:** ${new Date().toISOString()}`,
              `**Disparo:** ${context.eventName}`,
              ``,
              `Rodar manual:`,
              `\`\`\`bash`,
              `gh workflow run ingest-tse-redes-sociais.yml`,
              `\`\`\``,
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Nova falha — ${runUrl}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["cron-failure", "automated"],
              });
            }
